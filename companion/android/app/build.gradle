plugins {
    id "com.android.application"
}

android {
    namespace "com.yanyuliu.pockethub"
    compileSdk 34

    defaultConfig {
        applicationId "com.yanyuliu.pockethub"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "0.5.0"
    }

    // A fixed debug key (public, password "android") so that every CI build can be
    // installed over the previous one. It protects nothing and must not sign releases.
    signingConfigs {
        debug {
            storeFile rootProject.file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
