plugins {
    id "com.android.application"
}

android {
    namespace "com.yanyuliu.pockethub"
    compileSdk 34

    defaultConfig {
        applicationId "com.yanyuliu.pockethub"
        minSdk 26
        targetSdk 34
        versionCode 66
        versionName "0.32.6"
    }

    // The speech models are no longer packaged: they are published as the "speech" resource
    // pack (python3 -m xiaoyou_runtime app pack speech app/build/phone-speech/assets/asr) and
    // downloaded once by the phone, so app updates stay small. preparePhoneSpeech still fetches
    // and verifies them, and the AAR.
    // Compress native libraries so installed 0.12.x updaters can fetch this APK (<128 MB).
    packaging.jniLibs.useLegacyPackaging = true
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
            universalApk true
        }
    }

    // A fixed debug key (public, password "android") so that every CI build can be
    // installed over the previous one. It protects nothing and must not sign releases.
    signingConfigs {
        debug {
            storeFile rootProject.file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

def preparePhoneSpeech = tasks.register("preparePhoneSpeech", Exec) {
    inputs.files(rootProject.file("tools/prepare_phone_speech.py"), rootProject.file("tools/phone-speech.json"))
    outputs.files(layout.buildDirectory.file("phone-speech/sherpa-onnx-1.13.8.aar"),
            layout.buildDirectory.file("phone-speech/assets/asr/zh/model.int8.onnx"),
            layout.buildDirectory.file("phone-speech/assets/asr/zh/tokens.txt"),
            layout.buildDirectory.file("phone-speech/assets/asr/sense-voice/model.int8.onnx"),
            layout.buildDirectory.file("phone-speech/assets/asr/sense-voice/tokens.txt"))
    def pythonCommand = providers.environmentVariable("PYTHON").getOrElse(
            System.getProperty("os.name").toLowerCase().contains("windows") ? "python" : "python3")
    commandLine pythonCommand, rootProject.file("tools/prepare_phone_speech.py"), layout.buildDirectory.dir("phone-speech").get().asFile
}
tasks.named("preBuild").configure { dependsOn preparePhoneSpeech }

dependencies {
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    // ZXing's published 4.3.0 POM omits these scanner runtime dependencies.
    implementation "androidx.core:core:1.6.0"
    implementation "androidx.fragment:fragment:1.3.6"
    implementation "com.google.zxing:core:3.5.4"
    implementation "org.bouncycastle:bcprov-jdk18on:1.86"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation files(layout.buildDirectory.file("phone-speech/sherpa-onnx-1.13.8.aar")).builtBy(preparePhoneSpeech)
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.20"
    testImplementation "junit:junit:4.13.2"
}

def verifyScannerRuntime = tasks.register("verifyScannerRuntime", Exec) {
    dependsOn "assembleDebug"
    def pythonCommand = providers.environmentVariable("PYTHON").getOrElse(
            System.getProperty("os.name").toLowerCase().contains("windows") ? "python" : "python3")
    commandLine pythonCommand, rootProject.file("tools/verify_scanner_apk.py"),
            layout.buildDirectory.dir("outputs/apk/debug").get().asFile
}
tasks.configureEach { task ->
    if (task.name == "assembleDebug") task.finalizedBy verifyScannerRuntime
}
